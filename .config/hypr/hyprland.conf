########################################################################################
AUTOGENERATED HYPR CONFIG.
PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
########################################################################################

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/

monitor=,preferred,auto,1
#monitor=eDP-1,1920x1080,1920x0,1
#monitor=HDMI-A-1,1920x080,0x0,1


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch"01d": "", #
    "01n": "", #
    "02d": "󰖕", #
    "02n": "󰼱", #
    "03d": "󰖐", #
    "03n": "󰖐", #
    "04d": "󰖐", #
    "04n": "󰖐", #
    "09d": "", #
    "09n": "", #
    "10d": "", #
    "10n": "", #
    "11d": "", #
    "11n": "", #
    "13d": "", #
    "13n": "", #
    "50d": "", #
    "50n": "", #

exec-once = waybar -c ~/.config/waybar/config.jsonc
exec-once = ~/.config/hypr/scripts/startupWallpaper.sh
exec-once = swaync
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hyprctl setcursor "Capitaine Cursors (Gruvbox)" 24
exec-once = wlsunset -l 44.8 -L 20.4
exec-once = pypr
exec-once = bluetoothctl power off
exec-once = swayosd-server
exec-once = ~/.config/hypr/scripts/stop-swayosd.sh
exec-once = [workspace special:neovim silent:fullscreen] kitty nvim

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
env = XCURSOR_SIZE,24

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us, rs, rs
    kb_variant = , latin
    kb_model =
    kb_options = grp:alt_shift_toggle, caps:swapescape
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 2 #5
    gaps_out = 4 #20
    border_size = 2.5
    col.active_border = rgb(fbf1c7) rgb(b16286) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_is_master = true
    orientation = left
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = on
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device:epic-mouse-v1 {
    sensitivity = -0.5
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, kitty
bind = $mainMod, C, killactive, 
# bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, nautilus
bind = $mainMod, F, togglefloating,
bind = $mainMod, M, fullscreen,
bind = $mainMod, Space, exec, ~/.config/rofi/launchers/type-7/launcher.sh
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, W, exec, ~/.config/hypr/scripts/changeWallpaper.sh

#scratchpads
bind = $mainMod, R, exec, pypr toggle lf && hyprctl dispatch bringactivetotop
bind = $mainMod, S, exec, pypr toggle spotify && hyprctl dispatch bringactivetotop
bind = $mainMod, Q, exec, pypr toggle terminal && hyprctl dispatch bringactivetotop
bind = $mainMod, T, exec, pypr toggle qbittorrent && hyprctl dispatch bringactivetotop
bind = $mainMod, U, exec, pypr toggle tuido && hyprctl dispatch bringactivetotop
bind = $mainMod, V, exec, pypr toggle nvim && hyprctl dispatch bringactivetotop
bind = $mainMod, B, exec, pypr toggle_special neovim
bind = $mainMod SHIFT, B, togglespecialworkspace, neovim


$scratchpadsize = size 80% 85%
$scratchpad = class:^(scratchpad)$
windowrulev2 = float, $scratchpad
windowrulev2 = $scratchpadsize, $scratchpad
windowrulev2 = workspace special silent, $scratchpads
windowrulev2 = center, $scratchpad

$neovim = class:^(neovim)$
#windowrulev2 = fullscreen, $neovim
windowrulev2 = float, $neovim
windowrulev2 = center, $neovim

$weather = class:^(weather)$
windowrulev2 = float, $weather
windowrulev2 = size 60% 76%, $weather
windowrulev2 = workspace special silent, $weather
windowrulev2 = center, $weather

$calendar = class:^(calendar)$
windowrulev2 = float, $calendar
windowrulev2 = size 721 483, $calendar
windowrulev2 = move 594 56, $calendar
windowrulev2 = workspace special silent, $calendar

$spotify = class:^(Spotify)$
windowrulev2 = float, $spotify
windowrulev2 = $scratchpadsize, $spotify
windowrulev2 = workspace special silent, $spotify
windowrulev2 = center, $spotify

#sound & brightness buttons
bind = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bind = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bind = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bind = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bind = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bind = ,Print, exec, grim -g "$(slurp -d)" - | wl-copy

#caps lock
bind = ,Caps_lock, exec, sleep 0.1 && swayosd-client --caps-lock

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
